[project]
name = "howmany-model"
version = "0.1.0"
description = "Export, benchmark and labelled photos for the counting model of how many?"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "modal>=1.5.5",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "PTH", "LOG"]

[tool.mypy]
strict = true
files = ["."]
exclude = ["^\\.venv/", "^data/"]

[[tool.mypy.overrides]]
# torch only exists in export.py's Modal container.
module = ["onnxruntime", "onnxruntime.*", "torch", "torch.*"]
ignore_missing_imports = true

