repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --project model ruff format
        language: system
        types: [python]
        files: ^model/
      - id: ruff-check
        name: ruff check
        entry: uv run --project model ruff check --fix
        language: system
        types: [python]
        files: ^model/
      - id: mypy
        name: mypy
        entry: bash -c 'cd model && uv run mypy'
        language: system
        files: ^model/
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: bash -c 'cd model && uv run pytest -q'
        language: system
        files: ^model/
        pass_filenames: false
      - id: android-format
        name: android format
        entry: bash -c 'cd android && ./gradlew -q spotlessApply'
        language: system
        files: ^android/
        pass_filenames: false
      - id: android-check
        name: android lint and unit tests
        entry: bash -c 'cd android && ./gradlew -q lintDebug testDebugUnitTest'
        language: system
        files: ^android/
        pass_filenames: false
